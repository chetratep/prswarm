name: Release

# Triggered by pushing a version tag (v1.2.3), or manually for a re-run.
# Builds a standalone binary for every platform from ONE ubuntu-latest
# runner — `bun build --compile --target=bun-<os>-<arch>` cross-compiles by
# downloading the target's own Bun runtime, no native per-OS runner needed
# (see https://bun.com/docs/bundler/executables). Publishes a DRAFT release
# with every binary attached, so nothing goes out until you review and hit
# "Publish" yourself.
#
# Security notes:
# - Every action below is pinned to a commit SHA, not a mutable tag — a tag
#   can be moved to point at different (compromised) code after the fact,
#   a SHA can't. The `# vX.Y.Z` comment is just for humans; it isn't
#   trusted by anything.
# - `permissions` defaults to read-only at the workflow level; only the
#   `release` job (the one that actually needs to publish a release) is
#   granted `contents: write`, scoped to just that job.
# - Every checkout sets `persist-credentials: false` — none of these jobs
#   push back to the repo, so there's no reason for the git credential to
#   stick around in the runner's config for something else to pick up.
# - Values that flow into a `run:` shell script go through `env:` first
#   rather than being interpolated directly via ${{ }} — none of the
#   values here are attacker-controlled today (matrix entries are
#   hardcoded in this file; the manual tag input requires existing write
#   access to trigger), but routing through env keeps it that way even if
#   that changes later, and costs nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v1.2.3)"
        required: true

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run --filter '@prswarm/web' build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  build-binaries:
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            name: linux-x64
          - target: bun-linux-arm64
            name: linux-arm64
          - target: bun-darwin-x64
            name: macos-x64
          - target: bun-darwin-arm64
            name: macos-arm64
          - target: bun-windows-x64
            name: windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist

      - name: Compile
        env:
          BUN_TARGET: ${{ matrix.target }}
          ASSET_NAME: ${{ matrix.name }}
        run: bun run compile -- "--target=${BUN_TARGET}" "--outfile=dist/prswarm-${ASSET_NAME}"

      - name: Checksum
        env:
          ASSET_NAME: ${{ matrix.name }}
        working-directory: dist
        shell: bash
        run: |
          for f in "prswarm-${ASSET_NAME}"*; do
            sha256sum "$f" >> "prswarm-${ASSET_NAME}.sha256"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.name }}
          path: dist/prswarm-${{ matrix.name }}*
          retention-days: 7

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Combine checksums
        working-directory: release-assets
        run: cat *.sha256 > SHA256SUMS.txt && rm -f prswarm-*.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --draft \
            --title "PRSwarm ${RELEASE_TAG}" \
            --generate-notes \
            release-assets/*
